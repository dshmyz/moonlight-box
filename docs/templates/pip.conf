# PyPI 配置文件模板
# 将此文件复制到 ~/.pip/pip.conf (Linux/Mac) 或 %APPDATA%\pip\pip.ini (Windows)

[global]
# 仓库地址
index-url = http://your-registry:9081/repo/pypi-virtual/simple/

# 信任主机（使用 HTTP 时需要）
trusted-host = your-registry

# 超时设置
timeout = 60

# 重试次数
retries = 5

[install]
# 额外的包源（可选）
extra-index-url = http://your-registry:9081/repo/pypi-local/simple/

# 不使用二进制包（可选）
# only-binary = :all:

# 用户安装（可选）
# user = true

[download]
# 下载缓存目录
cache-dir = ~/.pip-cache

[search]
# 搜索索引（可选）
index = http://your-registry:9081/repo/pypi-virtual/
