# Moonlight Registry AI 配置文件
# 本文件包含AI服务的完整配置示例
# 注意：生产环境请使用环境变量存储敏感信息

# ========================================
# AI 服务基础配置
# ========================================
ai:
  # 是否启用AI服务
  enabled: false

  # AI服务提供商
  # 支持的提供商: chatglm, qwen, openai, anthropic, custom
  provider: "openai"

  # AI服务基础URL
  # - ChatGLM: http://localhost:8000/v1
  # - OpenAI: https://api.openai.com/v1
  # - Anthropic: https://api.anthropic.com/v1
  # - 内网部署: http://192.168.1.100:8080/v1
  base_url: "${MOONLIGHT_AI_BASE_URL}"

  # API密钥（生产环境请使用环境变量）
  # 建议使用环境变量: MOONLIGHT_AI_API_KEY
  api_key: "${MOONLIGHT_AI_API_KEY}"

  # 使用的模型名称
  # - ChatGLM: chatglm3-6b, chatglm2-6b
  # - OpenAI: gpt-4, gpt-3.5-turbo
  # - Anthropic: claude-3-5-sonnet, claude-3-opus
  model: "gpt-4"

  # 最大生成token数
  # 建议值: 2048-4096
  max_tokens: 2048

  # 温度参数（0.0-2.0）
  # 较低的值（0.2-0.5）使输出更确定
  # 较高的值（0.7-1.0）使输出更随机
  temperature: 0.7

  # 请求超时时间
  timeout: 30s

  # ========================================
  # 工具配置
  # ========================================
  tools:
    # 是否启用工具调用
    enabled: true

    # 允许使用的工具列表
    # 可选工具:
    # - query_logs: 查询系统日志
    # - query_database: 查询数据库统计
    # - query_package_info: 查询包信息
    # - analyze_security: 安全分析
    # - generate_demo_code: 生成示例代码
    allowed_tools:
      - query_logs
      - query_database
      - query_package_info
      - analyze_security
      - generate_demo_code

    # 工具最大执行时间（秒）
    max_execution_time: 10

    # 是否启用审计日志
    # 记录所有工具调用，用于安全审计
    enable_audit_log: true

  # ========================================
  # 限流配置
  # ========================================
  rate_limit:
    # 每分钟请求限制
    # 防止用户过度使用AI服务
    requests_per_minute: 20

    # 每天请求限制
    requests_per_day: 500

    # 每天token使用限制
    # 控制API调用成本
    tokens_per_day: 100000

  # ========================================
  # 缓存配置
  # ========================================
  cache:
    # 是否启用响应缓存
    # 相同问题直接返回缓存结果，节省API调用
    enabled: true

    # 缓存有效期
    # 建议值: 1h-24h
    ttl: 1h

    # 最大缓存条目数
    # 防止内存占用过大
    max_size: 1000

  # ========================================
  # 会话配置
  # ========================================
  session:
    # 会话最大存活时间
    # 超过此时间的会话将被自动清理
    max_age: 24h

    # 会话最大消息数
    # 限制上下文长度，防止token消耗过大
    max_messages: 50

