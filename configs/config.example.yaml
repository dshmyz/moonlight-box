server:
  host: 0.0.0.0
  port: 9081
  mode: debug  # debug / release / test
  read_timeout: 30s
  write_timeout: 0s
  idle_timeout: 60s  # 空闲连接超时
  static_dir: "./cmd/registry/front"  # 前端静态文件目录（为空则使用 embed 嵌入版本）
  max_upload_size: 209715200  # 上传体积上限 (200MB)

database:
  driver: sqlite  # sqlite / postgres / mysql
  dsn: "./data/registry.db"
  log_level: warn  # silent / error / warn / info
  max_open_conns: 100  # 最大打开连接数（sqlite 默认 4，由代码强制设置）
  max_idle_conns: 10
  conn_max_lifetime: 1h
  conn_max_idle_time: 30m
  # postgres:
  #   host: localhost
  #   port: 5432
  #   database: moonlight
  #   username: registry
  #   password: your-password
  # mysql:
  #   dsn: "registry:password@tcp(localhost:3306)/moonlight?charset=utf8mb4&parseTime=True&loc=Local"

storage:
  backend: local  # local / s3
  local:
    base_path: "./data/packages"
    max_size_gb: 100

auth:
  jwt_secret: change-me-in-production-use-random-string
  token_expiry: 24h
  refresh_expiry: 168h
  min_password_len: 8
  max_login_attempts: 5
  lockout_duration: 15m
  
  # CAS 单点登录配置
  cas:
    enabled: false
    server_url: "https://cas.example.com/cas"
    service_url: "http://localhost:9081"
    login_path: "/cas/login"
    validate_path: "/cas/serviceValidate"

security:
  enabled: true
  scan_on_upload: false  # Phase 2 启用
  block_critical: true
  block_high: true

cache:
  enabled: true
  default_ttl: 24h
  max_size_gb: 10
  eviction_policy: lru  # lru / fifo / ttl

logging:
  level: info  # debug / info / warn / error
  format: console  # console / json
  output: stdout  # stdout / stderr / 文件路径（如 ./logs/app.log）
  # 分文件日志（启用后按类型拆分到不同文件，便于轮转和检索）
  enable_split_files: false
  sql_log_file: "./logs/sql.log"
  error_log_file: "./logs/error.log"
  access_log_file: "./logs/access.log"
  log_retention_days: 30  # 日志保留天数（lumberjack 轮转依据）
  cleanup_interval: 24h  # 日志清理检查间隔
  # 日志采样配置（避免高频错误日志刷屏）
  # sample_rate: 0=不记录, 1=全部记录, 0.1=10%记录
  # 仅对 warn/error 级别生效
  sample_rate: 1.0
  # 按模块配置采样率（优先级高于全局配置）
  sample_by_module:
    # 示例：代理模块错误日志只记录10%
    # proxy: 0.1
    # 示例：健康检查警告日志只记录50%
    # health: 0.5

# 代理仓库配置
proxy:
  default_timeout: 30s
  connect_timeout: 10s
  large_file_threshold: 52428800  # 大文件阈值 (50MB)
  max_redirects: 10
  # insecure_skip_verify: true   # 是否跳过 SSL 证书校验（默认 true，对自签名上游生效；如需强制校验改为 false）

  # DNS 映射（用于内网解析）
  # dns_mapping:
  #   "registry.npmjs.org": "10.0.0.1"
  #   "repo.maven.apache.org": "10.0.0.2"
  
  # 健康检查配置
  health_check:
    enabled: true
    interval: 30s
    timeout: 5s
    failure_threshold: 3
    block_on_unhealthy: false  # 健康检查不健康时是否阻断请求

# AI 配置
ai:
  enabled: false
  provider: "chatglm"  # chatglm, qwen, custom
  base_url: "http://localhost:8000/v1"
  api_key: ""
  model: "chatglm3-6b"
  max_tokens: 2048
  temperature: 0.7
  timeout: 30s
  
  tools:
    enabled: true
    allowed_tools:
      - log_query
      - db_query
      - package_info
      - security_analysis
      - code_generator
      - block_log_analyzer
      - dependency_optimizer
    max_execution_time: 10
    enable_audit_log: true
  
  rate_limit:
    requests_per_minute: 20
    requests_per_day: 500
    tokens_per_day: 100000
  
  cache:
    enabled: true
    ttl: 1h
    max_size: 1000
  
  session:
    max_age: 24h
    max_messages: 50

# 初始化数据配置
seed:
  enabled: true  # 是否启用种子数据（角色、权限、管理员账号等）
  load_test_data: false  # 是否加载测试包数据（生产环境建议设为 false）

# 服务层配置
service:
  # 依赖解析最大并发数（控制Maven/Go包下载后的异步依赖解析任务数）
  max_concurrent_dep_parse: 10
  # 存储操作超时时间
  storage_op_timeout: 30s
  # 数据库操作超时时间
  db_op_timeout: 10s
