server:
  host: 0.0.0.0
  port: 9081
  mode: debug  # debug / release / test
  read_timeout: 30s
  write_timeout: 30s

database:
  driver: sqlite  # sqlite / postgres
  dsn: "./data/registry.db"
  # postgres:
  #   host: localhost
  #   port: 5432
  #   database: moonlight
  #   username: registry
  #   password: your-password

storage:
  backend: local  # local / s3
  local:
    base_path: "./data/packages"
    max_size_gb: 100

auth:
  jwt_secret: change-me-in-production-use-random-string
  token_expiry: 24h
  refresh_expiry: 168h
  min_password_len: 8
  max_login_attempts: 5
  lockout_duration: 15m
  
  # CAS 单点登录配置
  cas:
    enabled: false
    server_url: "https://cas.example.com/cas"
    service_url: "http://localhost:9081"
    login_path: "/cas/login"
    validate_path: "/cas/serviceValidate"

security:
  enabled: true
  scan_on_upload: false  # Phase 2 启用
  block_critical: true
  block_high: true

cache:
  enabled: true
  default_ttl: 24h
  max_size_gb: 10
  eviction_policy: lru  # lru / fifo / ttl

logging:
  level: info  # debug / info / warn / error
  format: console  # console / json
  output: stdout  # stdout / stderr / 文件路径（如 ./logs/app.log）

# 代理仓库配置
proxy:
  default_timeout: 30s
  connect_timeout: 10s
  large_file_threshold: 52428800  # 大文件阈值 (50MB)
  max_redirects: 10
  insecure_skip_verify: false  # 是否跳过 SSL 证书校验
  
  # DNS 映射（用于内网解析）
  # dns_mapping:
  #   "registry.npmjs.org": "10.0.0.1"
  #   "repo.maven.apache.org": "10.0.0.2"
  
  # 健康检查配置
  health_check:
    enabled: true
    interval: 30s
    timeout: 5s
    failure_threshold: 3

# AI 配置
ai:
  enabled: false
  provider: "chatglm"  # chatglm, qwen, custom
  base_url: "http://localhost:8000/v1"
  api_key: ""
  model: "chatglm3-6b"
  max_tokens: 2048
  temperature: 0.7
  timeout: 30s
  
  tools:
    enabled: true
    allowed_tools:
      - log_query
      - db_query
      - package_info
      - security_analysis
      - code_generator
    max_execution_time: 10
    enable_audit_log: true
  
  rate_limit:
    requests_per_minute: 20
    requests_per_day: 500
    tokens_per_day: 100000
  
  cache:
    enabled: true
    ttl: 1h
    max_size: 1000
  
  session:
    max_age: 24h
    max_messages: 50

# 初始化数据配置
seed:
  enabled: true  # 是否启用种子数据（角色、权限、管理员账号等）
  load_test_data: false  # 是否加载测试包数据（生产环境建议设为 false）
